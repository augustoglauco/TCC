[project]
name = "assistente-multimodal-backend"
version = "0.1.0"
description = "Backend do assistente virtual multimodal (TCC) — roteador, RAG, MCPs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "qdrant-client>=1.9",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "gpu: teste depende de GPU/modelo local, pulado por padrão sem GPU disponível",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
