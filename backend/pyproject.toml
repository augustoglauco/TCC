[project]
name = "assistente-multimodal-backend"
version = "0.1.0"
description = "Backend do assistente virtual multimodal (TCC) — roteador, RAG, MCPs."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "httpx2>=2.13",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "qdrant-client>=1.9",
    "mcp>=2.0",
    "faster-whisper>=1.0",
    "sentence-transformers>=3.0",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "pytesseract>=0.3",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "fpdf2>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)`/`Form(...)`/`File(...)` como default de parâmetro é o idioma
# padrão do FastAPI, não um mutable default problemático — evita falso
# positivo do B008.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Form",
    "fastapi.params.Form",
    "fastapi.File",
    "fastapi.params.File",
    "fastapi.Query",
    "fastapi.params.Query",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `src` na frente do sys.path para que a suite teste SEMPRE o codigo da
# arvore em que o pytest roda. Sem isto, o editable install do .venv
# (um .pth com caminho absoluto) faz `import app` resolver para o
# checkout principal, e um git worktree acaba testando o codigo do outro.
pythonpath = ["src"]
markers = [
    "gpu: teste depende de GPU/modelo local, pulado por padrão sem GPU disponível",
    "qdrant: teste depende de uma instância real do Qdrant no ar (ver backend/docker-compose.yml)",
]
# Os dois avisos abaixo vêm do `qdrant-client` em modo local, que é como a
# suíte roda por padrão (sem Qdrant no ar): índice de payload é no-op no modo
# local — em produção, com o Qdrant em Docker, ele vale — e a checagem de
# compatibilidade de versão não tem servidor para consultar. Nenhum dos dois
# aponta defeito no código, e silenciá-los mantém o resumo de warnings do
# pytest utilizável para avisos que importam.
filterwarnings = [
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
    "ignore:Failed to obtain server version:UserWarning",
    # Os dois abaixo são defasagem de versão DENTRO das dependências, sem
    # nenhum ponto de chamada nosso: o `TestClient` do Starlette usa o alias
    # `anyio.abc.BlockingPortal`, e o FastAPI usa a constante
    # `HTTP_422_UNPROCESSABLE_ENTITY` que o próprio Starlette depreciou.
    # Some quando as duas subirem de versão; até lá só poluiriam o resumo.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated:",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
